<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duty On/Off Report Portal</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
    body{
        font-family: Arial, sans-serif;
        background:#f4f6f9;
        margin:0;
        padding:20px;
    }

    .container{
        max-width:1400px;
        margin:auto;
    }

    h1{
        text-align:center;
        color:#1d3557;
        margin-bottom:5px;
    }

    h3{
        text-align:center;
        color:#555;
        margin-top:0;
        margin-bottom:30px;
    }

    .form-section{
        background:#fff;
        padding:20px;
        border-radius:10px;
        box-shadow:0 2px 8px rgba(0,0,0,0.1);
        margin-bottom:25px;
    }

    .form-grid{
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
        gap:15px;
    }

    label{
        font-weight:bold;
        display:block;
        margin-bottom:5px;
    }

    input, select{
        width:100%;
        padding:10px;
        border:1px solid #ccc;
        border-radius:6px;
        font-size:14px;
    }

    button{
        background:#1d3557;
        color:white;
        border:none;
        padding:12px 20px;
        border-radius:6px;
        cursor:pointer;
        font-size:15px;
        margin-top:20px;
        margin-right:10px;
    }

    button:hover{
        background:#457b9d;
    }

    .report-section{
        background:#fff;
        padding:20px;
        border-radius:10px;
        box-shadow:0 2px 8px rgba(0,0,0,0.1);
    }

    table{
        width:100%;
        border-collapse:collapse;
        margin-top:20px;
    }

    th, td{
        border:1px solid #ddd;
        padding:10px;
        text-align:center;
        font-size:14px;
    }

    th{
        background:#1d3557;
        color:white;
    }

    .green{
        background:#b7efc5;
        color:#006400;
        font-weight:bold;
    }

    .red{
        background:#ffccd5;
        color:#b00020;
        font-weight:bold;
    }

    .category-header{
        background:#e9ecef;
        font-weight:bold;
        text-align:left;
        padding:10px;
        font-size:16px;
    }

</style>
</head>

<body>

<div class="container">

    <h1>Duty On / Off Report Portal</h1>
    <h3>Report Created by Fadna - Administration Team</h3>

    <div class="form-section">

        <div class="form-grid">

            <div>
                <label>Rep Name</label>
                <select id="repName">
                    <option>HESHAN</option>
                    <option>SANDUN</option>
                    <option>SAMEERA</option>
                    <option>SAMANTHA</option>
                    <option>VIRAJ</option>
                    <option>PATHUM</option>
                    <option>TINUKA</option>
                    <option>CHAMOD</option>
                    <option>VIMUKTHI</option>
                    <option>THARINDU</option>
                    <option>CHAMAL</option>
                    <option>KOLITHA</option>
                    <option>AKISARA</option>
                    <option>THUSHANTHA</option>
                    <option>HIRAN</option>
                </select>
            </div>

            <div>
                <label>Sales Category</label>
                <select id="salesCategory">
                    <option>Direct Trade</option>
                    <option>Modern Trade</option>
                    <option>Salon</option>
                </select>
            </div>

            <div>
                <label>Date</label>
                <input type="date" id="date">
            </div>

            <div>
                <label>Duty On</label>
                <input type="time" id="dutyOn">
            </div>

            <div>
                <label>Duty Off</label>
                <input type="time" id="dutyOff">
            </div>

            <div>
                <label>Area of Visit</label>
                <input type="text" id="areaVisit">
            </div>

            <div>
                <label>Distance from Starting Town (KM)</label>
                <input type="number" id="distance" placeholder="Enter KM">
            </div>

        </div>

        <button onclick="addRecord()">Add Record</button>
        <button onclick="downloadPNG()">Download Report PNG</button>

    </div>

    <div class="report-section" id="reportSection">

        <table id="reportTable">

            <thead>
                <tr>
                    <th>Rep Name</th>
                    <th>Sales Category</th>
                    <th>Date</th>
                    <th>Duty On</th>
                    <th>Duty On Status</th>
                    <th>Duty Off</th>
                    <th>Duty Off Status</th>
                    <th>Area of Visit</th>
                    <th>Distance (KM)</th>
                    <th>Distance Status</th>
                </tr>
            </thead>

            <tbody id="tableBody">

            </tbody>

        </table>

    </div>

</div>

<script>

function getDutyOnStatus(time){

    if(time >= "06:30" && time <= "09:30"){
        return {
            text:"IN TIME",
            className:"green"
        };
    }else{
        return {
            text:"LATE",
            className:"red"
        };
    }
}

function getDutyOffStatus(time){

    if(time >= "16:30" && time <= "18:30"){
        return {
            text:"IN TIME",
            className:"green"
        };
    }else{
        return {
            text:"OUT OF RANGE",
            className:"red"
        };
    }
}

function getDistanceStatus(distance){

    if(distance > 5){
        return {
            text:"OVER 5KM",
            className:"red"
        };
    }else{
        return {
            text:"NORMAL",
            className:"green"
        };
    }
}

function addRecord(){

    const repName = document.getElementById("repName").value;
    const salesCategory = document.getElementById("salesCategory").value;
    const date = document.getElementById("date").value;
    const dutyOn = document.getElementById("dutyOn").value;
    const dutyOff = document.getElementById("dutyOff").value;
    const areaVisit = document.getElementById("areaVisit").value;
    const distance = document.getElementById("distance").value;

    if(!date || !dutyOn || !dutyOff || !areaVisit || !distance){
        alert("Please fill all fields");
        return;
    }

    const dutyOnStatus = getDutyOnStatus(dutyOn);
    const dutyOffStatus = getDutyOffStatus(dutyOff);
    const distanceStatus = getDistanceStatus(Number(distance));

    const tableBody = document.getElementById("tableBody");

    const row = `
        <tr>
            <td>${repName}</td>
            <td>${salesCategory}</td>
            <td>${date}</td>

            <td class="${dutyOnStatus.className}">${dutyOn}</td>
            <td class="${dutyOnStatus.className}">${dutyOnStatus.text}</td>

            <td class="${dutyOffStatus.className}">${dutyOff}</td>
            <td class="${dutyOffStatus.className}">${dutyOffStatus.text}</td>

            <td>${areaVisit}</td>

            <td class="${distanceStatus.className}">${distance}</td>
            <td class="${distanceStatus.className}">${distanceStatus.text}</td>
        </tr>
    `;

    tableBody.innerHTML += row;

}

function downloadPNG(){

    html2canvas(document.querySelector("#reportSection")).then(canvas => {

        const link = document.createElement("a");

        link.download = "Duty_On_Off_Report.png";
        link.href = canvas.toDataURL();

        link.click();

    });

}

</script>

</body>
</html>
