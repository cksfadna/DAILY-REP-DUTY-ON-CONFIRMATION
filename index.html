<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Duty On / Off Report Portal</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    margin:0;
    padding:20px;
}

.container{
    max-width:1450px;
    margin:auto;
}

h1{
    text-align:center;
    color:#1d3557;
    margin-bottom:5px;
}

h3{
    text-align:center;
    color:#666;
    margin-top:0;
    margin-bottom:25px;
}

.form-section{
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
    margin-bottom:25px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
}

label{
    font-weight:bold;
    display:block;
    margin-bottom:5px;
}

input, select{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:14px;
}

button{
    border:none;
    padding:12px 18px;
    border-radius:6px;
    cursor:pointer;
    font-size:15px;
    margin-top:20px;
    margin-right:10px;
    color:white;
}

.add-btn{
    background:#1d3557;
}

.download-btn{
    background:#198754;
}

.reset-btn{
    background:#dc3545;
}

.update-btn{
    background:#ff9800;
}

.edit-btn{
    background:#0d6efd;
    padding:8px 12px;
    font-size:13px;
}

.delete-btn{
    background:#dc3545;
    padding:8px 12px;
    font-size:13px;
}

button:hover{
    opacity:0.9;
}

.report-section{
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.report-header{
    text-align:center;
    margin-bottom:20px;
}

.report-header h2{
    color:#1d3557;
    margin-bottom:5px;
}

.report-header p{
    margin:3px;
    color:#555;
    font-size:14px;
}

.report-date{
    font-size:18px;
    font-weight:bold;
    margin-bottom:20px;
    color:#1d3557;
}

.category-title{
    background:#1d3557;
    color:white;
    padding:10px;
    margin-top:25px;
    border-radius:5px;
    font-size:18px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
}

th, td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
    font-size:14px;
}

th{
    background:#457b9d;
    color:white;
}

.green{
    background:#b7efc5;
    color:#006400;
    font-weight:bold;
}

.red{
    background:#ffccd5;
    color:#b00020;
    font-weight:bold;
}

.hidden{
    display:none;
}

</style>
</head>

<body>

<div class="container">

    <h1>Duty On / Off Report Portal</h1>
    <h3>Report Created by Fadna - Administration Team</h3>

    <div class="form-section">

        <div class="form-grid">

            <div>
                <label>Rep Name</label>
                <select id="repName">
                    <option>HESHAN</option>
                    <option>SANDUN</option>
                    <option>SAMEERA</option>
                    <option>SAMANTHA</option>
                    <option>VIRAJ</option>
                    <option>PATHUM</option>
                    <option>TINUKA</option>
                    <option>CHAMOD</option>
                    <option>VIMUKTHI</option>
                    <option>THARINDU</option>
                    <option>CHAMAL</option>
                    <option>KOLITHA</option>
                    <option>AKISARA</option>
                    <option>THUSHANTHA</option>
                    <option>HIRAN</option>
                </select>
            </div>

            <div>
                <label>Sales Category</label>
                <select id="salesCategory">
                    <option>Direct Trade</option>
                    <option>Modern Trade</option>
                    <option>Salon</option>
                </select>
            </div>

            <div>
                <label>Date</label>
                <input type="date" id="date">
            </div>

            <div>
                <label>Duty On</label>
                <input type="time" id="dutyOn">
            </div>

            <div>
                <label>Duty Off</label>
                <input type="time" id="dutyOff">
            </div>

            <div>
                <label>Area of Visit</label>
                <input type="text" id="areaVisit">
            </div>

            <div>
                <label>Distance from Starting Town (KM)</label>
                <input type="number" id="distance">
            </div>

        </div>

        <button class="add-btn" onclick="addRecord()">
            Add Record
        </button>

        <button class="update-btn hidden" id="updateButton"
            onclick="updateRecord()">
            Update Record
        </button>

        <button class="download-btn" onclick="downloadPNG()">
            Download PNG
        </button>

        <button class="reset-btn" onclick="resetReport()">
            Reset Report
        </button>

    </div>

    <div class="report-section" id="reportSection">

        <div class="report-header">

            <h2>Duty On / Off Monitoring Report</h2>

            <p>
                Generated By : Fadna Administration Team
            </p>

            <p id="downloadTime">
                Download Time : -
            </p>

        </div>

        <div class="report-date" id="reportDate">
            Report Date : -
        </div>

        <div id="categoryReports"></div>

    </div>

</div>

<script>

let records = [];
let editIndex = -1;

function getDutyOnStatus(time){

    if(!time || time.trim() === ""){
        return {
            text:"NO RECORD",
            className:"red"
        };
    }

    if(time >= "06:30" && time <= "09:30"){
        return {
            text:"IN TIME",
            className:"green"
        };
    }else{
        return {
            text:"LATE",
            className:"red"
        };
    }
}

function getDutyOffStatus(time){

    if(!time || time.trim() === ""){
        return {
            text:"NO RECORD",
            className:"red"
        };
    }

    if(time >= "16:30" && time <= "18:30"){
        return {
            text:"IN TIME",
            className:"green"
        };
    }else{
        return {
            text:"OUT OF RANGE",
            className:"red"
        };
    }
}

function getDistanceStatus(distance){

    if(distance > 5){
        return {
            text:"OVER 5KM",
            className:"red"
        };
    }else{
        return {
            text:"NORMAL",
            className:"green"
        };
    }
}

function getFormData(){

    return {
        repName: document.getElementById("repName").value,
        salesCategory: document.getElementById("salesCategory").value,
        date: document.getElementById("date").value,
        dutyOn: document.getElementById("dutyOn").value,
        dutyOff: document.getElementById("dutyOff").value,
        areaVisit: document.getElementById("areaVisit").value,
        distance: document.getElementById("distance").value
    };
}

function clearForm(){

    document.getElementById("date").value = "";
    document.getElementById("dutyOn").value = "";
    document.getElementById("dutyOff").value = "";
    document.getElementById("areaVisit").value = "";
    document.getElementById("distance").value = "";

}

function addRecord(){

    const data = getFormData();

    if(!data.date || !data.areaVisit || !data.distance){

        alert("Please fill required fields");
        return;
    }

    records.push(data);

    document.getElementById("reportDate").innerHTML =
        "Report Date : " + data.date;

    renderCategoryWiseReport();

    clearForm();

}

function renderCategoryWiseReport(){

    const categories = [
        "Direct Trade",
        "Modern Trade",
        "Salon"
    ];

    let html = "";

    categories.forEach(category => {

        const filtered =
            records.filter(r => r.salesCategory === category);

        if(filtered.length > 0){

            html += `
                <div class="category-title">
                    ${category}
                </div>

                <table>

                    <thead>

                        <tr>
                            <th>Rep Name</th>
                            <th>Date</th>
                            <th>Duty On</th>
                            <th>Duty On Status</th>
                            <th>Duty Off</th>
                            <th>Duty Off Status</th>
                            <th>Area of Visit</th>
                            <th>Distance</th>
                            <th>Distance Status</th>
                            <th>Actions</th>
                        </tr>

                    </thead>

                    <tbody>
            `;

            filtered.forEach(record => {

                const actualIndex =
                    records.indexOf(record);

                const dutyOnStatus =
                    getDutyOnStatus(record.dutyOn);

                const dutyOffStatus =
                    getDutyOffStatus(record.dutyOff);

                const distanceStatus =
                    getDistanceStatus(Number(record.distance));

                html += `
                    <tr>

                        <td>${record.repName}</td>

                        <td>${record.date}</td>

                        <td class="${dutyOnStatus.className}">
                            ${record.dutyOn || "NO RECORD"}
                        </td>

                        <td class="${dutyOnStatus.className}">
                            ${dutyOnStatus.text}
                        </td>

                        <td class="${dutyOffStatus.className}">
                            ${record.dutyOff || "NO RECORD"}
                        </td>

                        <td class="${dutyOffStatus.className}">
                            ${dutyOffStatus.text}
                        </td>

                        <td>${record.areaVisit}</td>

                        <td class="${distanceStatus.className}">
                            ${record.distance} KM
                        </td>

                        <td class="${distanceStatus.className}">
                            ${distanceStatus.text}
                        </td>

                        <td>

                            <button class="edit-btn"
                                onclick="editRecord(${actualIndex})">
                                Edit
                            </button>

                            <button class="delete-btn"
                                onclick="deleteRecord(${actualIndex})">
                                Delete
                            </button>

                        </td>

                    </tr>
                `;
            });

            html += `
                    </tbody>

                </table>
            `;
        }

    });

    document.getElementById("categoryReports").innerHTML =
        html;

}

function editRecord(index){

    const record = records[index];

    document.getElementById("repName").value =
        record.repName;

    document.getElementById("salesCategory").value =
        record.salesCategory;

    document.getElementById("date").value =
        record.date;

    document.getElementById("dutyOn").value =
        record.dutyOn;

    document.getElementById("dutyOff").value =
        record.dutyOff;

    document.getElementById("areaVisit").value =
        record.areaVisit;

    document.getElementById("distance").value =
        record.distance;

    editIndex = index;

    document.getElementById("updateButton")
        .classList.remove("hidden");

}

function updateRecord(){

    if(editIndex === -1){
        return;
    }

    records[editIndex] = getFormData();

    renderCategoryWiseReport();

    clearForm();

    editIndex = -1;

    document.getElementById("updateButton")
        .classList.add("hidden");

}

function deleteRecord(index){

    if(confirm("Delete this record?")){

        records.splice(index,1);

        renderCategoryWiseReport();

    }

}

function resetReport(){

    if(confirm("Reset all records?")){

        records = [];

        document.getElementById("categoryReports")
            .innerHTML = "";

        document.getElementById("reportDate")
            .innerHTML = "Report Date : -";

        clearForm();

    }

}

function downloadPNG(){

    const now = new Date();

    const formattedTime =
        now.toLocaleDateString() + " " +
        now.toLocaleTimeString();

    document.getElementById("downloadTime").innerHTML =
        "Download Time : " + formattedTime;

    html2canvas(
        document.querySelector("#reportSection")
    ).then(canvas => {

        const link = document.createElement("a");

        link.download = "Duty_On_Off_Report.png";

        link.href = canvas.toDataURL();

        link.click();

    });

}

</script>

</body>
</html>
