<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Duty On / Off Report Portal</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    margin:0;
    padding:20px;
}

.container{
    max-width:1800px;
    margin:auto;
}

h1{
    text-align:center;
    color:#1d3557;
    margin-bottom:5px;
}

h3{
    text-align:center;
    color:#666;
    margin-top:0;
    margin-bottom:25px;
}

.form-section{
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
    margin-bottom:25px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
}

label{
    font-weight:bold;
    display:block;
    margin-bottom:5px;
}

input,select{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:14px;
    box-sizing:border-box;
}

button{
    border:none;
    padding:12px 18px;
    border-radius:6px;
    cursor:pointer;
    font-size:15px;
    margin-top:20px;
    margin-right:10px;
    color:white;
}

.add-btn{
    background:#1d3557;
}

.download-btn{
    background:#198754;
}

.reset-btn{
    background:#dc3545;
}

.update-btn{
    background:#ff9800;
}

.action-btn{
    padding:8px 12px;
    border:none;
    border-radius:5px;
    color:white;
    cursor:pointer;
    margin:2px;
}

.edit-btn{
    background:#0d6efd;
}

.delete-btn{
    background:#dc3545;
}

button:hover{
    opacity:0.9;
}

.report-section{
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.report-header{
    text-align:center;
    margin-bottom:20px;
}

.report-header h2{
    color:#1d3557;
    margin-bottom:5px;
}

.report-header p{
    margin:3px;
    color:#555;
    font-size:14px;
}

.report-date{
    font-size:18px;
    font-weight:bold;
    margin-bottom:20px;
    color:#1d3557;
}

.category-title{
    background:#1d3557;
    color:white;
    padding:10px;
    margin-top:25px;
    border-radius:5px;
    font-size:18px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
    font-size:14px;
}

th{
    background:#457b9d;
    color:white;
}

.green{
    background:#b7efc5;
    color:#006400;
    font-weight:bold;
}

.red{
    background:#ffccd5;
    color:#b00020;
    font-weight:bold;
}

.hidden{
    display:none;
}

.hide-download{
    display:table-cell;
}

</style>

</head>

<body>

<div class="container">

    <h1>Duty On / Off Report Portal</h1>

    <h3>
        Report Created by Fadna - Administration Team
    </h3>

    <div class="form-section">

        <div class="form-grid">

            <div>
                <label>Rep Name</label>

                <select id="repName">
                    <option>HESHAN</option>
                    <option>SANDUN</option>
                    <option>SAMEERA</option>
                    <option>SAMANTHA</option>
                    <option>VIRAJ</option>
                    <option>PATHUM</option>
                    <option>TINUKA</option>
                    <option>CHAMOD</option>
                    <option>VIMUKTHI</option>
                    <option>THARINDU</option>
                    <option>CHAMAL</option>
                    <option>KOLITHA</option>
                    <option>AKISARA</option>
                    <option>THUSHANTHA</option>
                    <option>HIRAN</option>
                </select>
            </div>

            <div>
                <label>Sales Category</label>

                <select id="salesCategory">
                    <option>Direct Trade</option>
                    <option>Modern Trade</option>
                    <option>Salon</option>
                </select>
            </div>

            <div>
                <label>Date</label>

                <input type="date" id="date">
            </div>

            <div>
                <label>Duty On</label>

                <select id="dutyOnType" onchange="toggleDutyOn()">
                    <option value="TIME">Select Time</option>
                    <option value="NO RECORD">No Record</option>
                </select>

                <input type="time" id="dutyOn" style="margin-top:8px;">
            </div>

            <div>
                <label>First Action Time</label>

                <input type="time" id="firstActionTime">
            </div>

            <div>
                <label>Action Type</label>

                <select id="actionType">
                    <option>Call</option>
                    <option>Sale</option>
                    <option>Payment</option>
                    <option>Stock Taking</option>
                    <option>Return</option>
                    <option>Add Customer</option>
                </select>
            </div>

            <div>
                <label>Duty Off</label>

                <select id="dutyOffType" onchange="toggleDutyOff()">
                    <option value="TIME">Select Time</option>
                    <option value="NO RECORD">No Record</option>
                </select>

                <input type="time" id="dutyOff" style="margin-top:8px;">
            </div>

            <div>
                <label>Area of Visit</label>

                <input type="text" id="areaVisit">
            </div>

            <div>
                <label>Distance from Starting Town (KM)</label>

                <input type="number" id="distance">
            </div>

            <div>
                <label>Comment</label>

                <input type="text" id="comment">
            </div>

        </div>

        <button class="add-btn" onclick="addRecord()">
            Add Record
        </button>

        <button class="update-btn hidden"
            id="updateButton"
            onclick="updateRecord()">
            Update Record
        </button>

        <button class="download-btn"
            onclick="downloadPNG()">
            Download PNG
        </button>

        <button class="download-btn"
            onclick="downloadPDF()">
            Download PDF
        </button>

        <button class="reset-btn"
            onclick="resetReport()">
            Reset Report
        </button>

    </div>

    <div class="report-section" id="reportSection">

        <div class="report-header">

            <h2>Duty On / Off Monitoring Report</h2>

            <p>
                Generated By : Fadna Administration Team
            </p>

            <p id="downloadTime">
                Download Time : -
            </p>

        </div>

        <div class="report-date" id="reportDate">
            Report Date : -
        </div>

        <div id="categoryReports"></div>

    </div>

</div>

<script>

let records = [];

let editIndex = -1;

function toggleDutyOn(){

    const type =
        document.getElementById("dutyOnType").value;

    const input =
        document.getElementById("dutyOn");

    if(type === "NO RECORD"){

        input.value = "";
        input.disabled = true;

    }else{

        input.disabled = false;

    }

}

function toggleDutyOff(){

    const type =
        document.getElementById("dutyOffType").value;

    const input =
        document.getElementById("dutyOff");

    if(type === "NO RECORD"){

        input.value = "";
        input.disabled = true;

    }else{

        input.disabled = false;

    }

}

function getDutyOnStatus(time){

    if(!time){

        return {
            text:"NO RECORD",
            className:"red"
        };

    }

    if(time >= "06:30" && time <= "09:30"){

        return {
            text:"IN TIME",
            className:"green"
        };

    }

    return {
        text:"LATE",
        className:"red"
    };

}

function getDutyOffStatus(time, category){

    if(!time){

        return {
            text:"NO RECORD",
            className:"red"
        };

    }

    // Direct Trade
    if(category === "Direct Trade"){

        if(time >= "16:30" && time <= "20:00"){

            return {
                text:"IN TIME",
                className:"green"
            };

        }

        return {
            text:"OUT OF RANGE",
            className:"red"
        };

    }

    // Modern Trade & Salon
    if(time >= "16:30" && time <= "18:30"){

        return {
            text:"IN TIME",
            className:"green"
        };

    }

    return {
        text:"OUT OF RANGE",
        className:"red"
    };

}

function getDistanceStatus(distance){

    if(distance > 5){

        return {
            text:"OVER 5KM",
            className:"red"
        };

    }

    return {
        text:"NORMAL",
        className:"green"
    };

}

function calculateTimeGap(dutyOn, firstAction){

    if(!dutyOn || !firstAction){

        return "NO RECORD";

    }

    const dutyOnMinutes =
        parseInt(dutyOn.split(":")[0]) * 60 +
        parseInt(dutyOn.split(":")[1]);

    const firstActionMinutes =
        parseInt(firstAction.split(":")[0]) * 60 +
        parseInt(firstAction.split(":")[1]);

    const difference =
        firstActionMinutes - dutyOnMinutes;

    if(difference < 0){

        return "INVALID";

    }

    return difference + " MINS";

}

function getFormData(){

    let firstActionTime =
        document.getElementById("firstActionTime").value;

    let actionType =
        document.getElementById("actionType").value;

    if(!firstActionTime){

        actionType = "Not Available";

    }

    return {

        repName:
            document.getElementById("repName").value,

        salesCategory:
            document.getElementById("salesCategory").value,

        date:
            document.getElementById("date").value,

        dutyOn:
            document.getElementById("dutyOnType").value === "NO RECORD"
            ? ""
            : document.getElementById("dutyOn").value,

        firstActionTime:
            firstActionTime,

        actionType:
            actionType,

        dutyOff:
            document.getElementById("dutyOffType").value === "NO RECORD"
            ? ""
            : document.getElementById("dutyOff").value,

        areaVisit:
            document.getElementById("areaVisit").value,

        distance:
            document.getElementById("distance").value,

        comment:
            document.getElementById("comment").value

    };

}

function clearForm(){

    document.getElementById("date").value = "";
    document.getElementById("dutyOn").value = "";
    document.getElementById("firstActionTime").value = "";
    document.getElementById("dutyOff").value = "";
    document.getElementById("areaVisit").value = "";
    document.getElementById("distance").value = "";
    document.getElementById("comment").value = "";

    document.getElementById("actionType").selectedIndex = 0;

    document.getElementById("dutyOnType").value = "TIME";
    document.getElementById("dutyOffType").value = "TIME";

    document.getElementById("dutyOn").disabled = false;
    document.getElementById("dutyOff").disabled = false;

}

function addRecord(){

    const data = getFormData();

    if(!data.date || !data.areaVisit || !data.distance){

        alert("Please fill required fields");
        return;

    }

    records.push(data);

    document.getElementById("reportDate").innerHTML =
        "Report Date : " + data.date;

    renderCategoryWiseReport();

    clearForm();

}

function renderCategoryWiseReport(){

    const categories = [
        "Direct Trade",
        "Modern Trade",
        "Salon"
    ];

    let html = "";

    categories.forEach(category => {

        const filtered =
            records.filter(r =>
                r.salesCategory === category
            );

        if(filtered.length > 0){

            html += `

            <div class="category-title">
                ${category}
            </div>

            <table>

                <thead>

                    <tr>

                        <th>Rep Name</th>
                        <th>Date</th>
                        <th>Duty On</th>
                        <th>Duty On Status</th>
                        <th>First Action Time</th>
                        <th>Action Type</th>
                        <th>Duty On → First Action Gap</th>
                        <th>Duty Off</th>
                        <th>Duty Off Status</th>
                        <th>Area of Visit</th>
                        <th>Distance</th>
                        <th>Distance Status</th>
                        <th>Comment</th>
                        <th class="hide-download">Actions</th>

                    </tr>

                </thead>

                <tbody>

            `;

            filtered.forEach(record => {

                const actualIndex =
                    records.indexOf(record);

                const dutyOnStatus =
                    getDutyOnStatus(record.dutyOn);

                const dutyOffStatus =
                    getDutyOffStatus(
                        record.dutyOff,
                        record.salesCategory
                    );

                const distanceStatus =
                    getDistanceStatus(
                        Number(record.distance)
                    );

                const gap =
                    calculateTimeGap(
                        record.dutyOn,
                        record.firstActionTime
                    );

                html += `

                <tr>

                    <td>${record.repName}</td>

                    <td>${record.date}</td>

                    <td class="${dutyOnStatus.className}">
                        ${record.dutyOn || "NO RECORD"}
                    </td>

                    <td class="${dutyOnStatus.className}">
                        ${dutyOnStatus.text}
                    </td>

                    <td>
                        ${record.firstActionTime || "NO RECORD"}
                    </td>

                    <td>
                        ${record.actionType}
                    </td>

                    <td>
                        ${gap}
                    </td>

                    <td class="${dutyOffStatus.className}">
                        ${record.dutyOff || "NO RECORD"}
                    </td>

                    <td class="${dutyOffStatus.className}">
                        ${dutyOffStatus.text}
                    </td>

                    <td>
                        ${record.areaVisit}
                    </td>

                    <td class="${distanceStatus.className}">
                        ${record.distance} KM
                    </td>

                    <td class="${distanceStatus.className}">
                        ${distanceStatus.text}
                    </td>

                    <td>
                        ${record.comment || "-"}
                    </td>

                    <td class="hide-download">

                        <button class="action-btn edit-btn"
                            onclick="editRecord(${actualIndex})">
                            Edit
                        </button>

                        <button class="action-btn delete-btn"
                            onclick="deleteRecord(${actualIndex})">
                            Delete
                        </button>

                    </td>

                </tr>

                `;

            });

            html += `
                </tbody>
            </table>
            `;
        }

    });

    document.getElementById("categoryReports").innerHTML =
        html;

}

function editRecord(index){

    const record = records[index];

    document.getElementById("repName").value =
        record.repName;

    document.getElementById("salesCategory").value =
        record.salesCategory;

    document.getElementById("date").value =
        record.date;

    if(record.dutyOn){

        document.getElementById("dutyOnType").value =
            "TIME";

        document.getElementById("dutyOn").disabled =
            false;

        document.getElementById("dutyOn").value =
            record.dutyOn;

    }else{

        document.getElementById("dutyOnType").value =
            "NO RECORD";

        document.getElementById("dutyOn").value = "";

        document.getElementById("dutyOn").disabled =
            true;

    }

    if(record.dutyOff){

        document.getElementById("dutyOffType").value =
            "TIME";

        document.getElementById("dutyOff").disabled =
            false;

        document.getElementById("dutyOff").value =
            record.dutyOff;

    }else{

        document.getElementById("dutyOffType").value =
            "NO RECORD";

        document.getElementById("dutyOff").value = "";

        document.getElementById("dutyOff").disabled =
            true;

    }

    document.getElementById("firstActionTime").value =
        record.firstActionTime;

    document.getElementById("actionType").value =
        record.actionType === "Not Available"
        ? "Call"
        : record.actionType;

    document.getElementById("areaVisit").value =
        record.areaVisit;

    document.getElementById("distance").value =
        record.distance;

    document.getElementById("comment").value =
        record.comment || "";

    editIndex = index;

    document.getElementById("updateButton")
        .classList.remove("hidden");

}

function updateRecord(){

    if(editIndex === -1){

        return;

    }

    records[editIndex] = getFormData();

    renderCategoryWiseReport();

    clearForm();

    editIndex = -1;

    document.getElementById("updateButton")
        .classList.add("hidden");

}

function deleteRecord(index){

    if(confirm("Delete this record?")){

        records.splice(index,1);

        renderCategoryWiseReport();

    }

}

function resetReport(){

    if(confirm("Reset all records?")){

        records = [];

        document.getElementById("categoryReports")
            .innerHTML = "";

        document.getElementById("reportDate")
            .innerHTML = "Report Date : -";

        clearForm();

    }

}

function hideActionColumns(){

    const hiddenColumns =
        document.querySelectorAll(".hide-download");

    hiddenColumns.forEach(col => {

        col.style.display = "none";

    });

}

function showActionColumns(){

    const hiddenColumns =
        document.querySelectorAll(".hide-download");

    hiddenColumns.forEach(col => {

        col.style.display = "";

    });

}

function downloadPNG(){

    const now = new Date();

    const formattedTime =
        now.toLocaleDateString() + " " +
        now.toLocaleTimeString();

    document.getElementById("downloadTime").innerHTML =
        "Download Time : " + formattedTime;

    hideActionColumns();

    html2canvas(
        document.querySelector("#reportSection")
    ).then(canvas => {

        const link =
            document.createElement("a");

        link.download =
            "Duty_On_Off_Report.png";

        link.href =
            canvas.toDataURL();

        link.click();

        showActionColumns();

    });

}

async function downloadPDF(){

    const now = new Date();

    const formattedTime =
        now.toLocaleDateString() + " " +
        now.toLocaleTimeString();

    document.getElementById("downloadTime").innerHTML =
        "Download Time : " + formattedTime;

    hideActionColumns();

    const { jsPDF } = window.jspdf;

    html2canvas(
        document.querySelector("#reportSection"),
        {
            scale:2
        }
    ).then(canvas => {

        const imgData =
            canvas.toDataURL("image/png");

        const pdf =
            new jsPDF(
                "l",
                "mm",
                "a4"
            );

        const pdfWidth =
            pdf.internal.pageSize.getWidth();

        const pdfHeight =
            (canvas.height * pdfWidth) /
            canvas.width;

        pdf.addImage(
            imgData,
            "PNG",
            0,
            0,
            pdfWidth,
            pdfHeight
        );

        pdf.save(
            "Duty_On_Off_Report.pdf"
        );

        showActionColumns();

    });

}

</script>

</body>
</html>
